model: magnetic_sequence_cnn
seed: 42
features: [magN, magV, magH, dip]
grid_cell_m: 1.0
window_frames: 84
window_sweep_frames: [50, 84, 134, 167]
hidden_size: 128
position_dropout: 0.2
minimum_variance: 0.01
batch_size: 128
num_workers: 0
epochs: 60
optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.0001
scheduler:
  name: reduce_on_plateau
  patience: 8
  factor: 0.5
trajectory:
  epsilon_m: 1.6
  minimum_path_m: 30.0
  sampling_hz: 16.7
  speed_min_mps: 1.0
  speed_max_mps: 1.35
  train_walks: 300
  test_walks: 60
  test_seed: 200
  train_stride_frames: 5
  test_stride_frames: 10
