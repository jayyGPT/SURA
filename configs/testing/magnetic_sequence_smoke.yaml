model: magnetic_sequence_cnn
seed: 3
features: [magN, magV, magH, dip]
grid_cell_m: 1.0
window_frames: 8
window_sweep_frames: [8]
hidden_size: 16
minimum_variance: 0.01
batch_size: 8
num_workers: 0
epochs: 1
optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.0
scheduler:
  name: reduce_on_plateau
  patience: 1
  factor: 0.5
trajectory:
  epsilon_m: 1.5
  minimum_path_m: 2.0
  sampling_hz: 4.0
  speed_min_mps: 1.0
  speed_max_mps: 1.0
  train_walks: 2
  test_walks: 1
  test_seed: 10
  train_stride_frames: 2
  test_stride_frames: 2
