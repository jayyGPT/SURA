model: anomaly_dual_kalmannet
status: legacy_reproducibility_baseline
seed: 42
hidden_size: 64
temporal_bins: 160
train_walks: 250
test_walks: 60
epochs: 150
batch_size: 32
regimes:
  full_wifi:
    wifi_period_s: 1.0
    ap_dropout: 0.0
  degraded_wifi:
    wifi_period_s: 5.0
    ap_dropout: 0.4
optimizer:
  name: adam
  learning_rate: 0.002
  weight_decay: 0.00001
