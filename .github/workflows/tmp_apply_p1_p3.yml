name: Temporary P1-P3 validation
on:
  push:
    branches:
      - fix/p1-p3-methodology
permissions:
  contents: write
jobs:
  validate:
    if: "${{ startsWith(github.event.head_commit.message, 'test: run P1-P3') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-p3-methodology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply methodology patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp_apply_p1_p3.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('## Priority B — architecture consistency / explanation', '## Priority B - architecture consistency / explanation')
          path.write_text(text, encoding='utf-8')
          PY
          python .github/tmp_apply_p1_p3.py
          python - <<'PY'
          from pathlib import Path
          path = Path('train/kalmannet_wifiheatmap_magneticCNN_pdr.py')
          text = path.read_text(encoding='utf-8').replace('HEADING_WHITE_NOISE_RAD', 'HEADING_WHITE_NOISE_STD_RAD')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile train/kalmannet_wifiheatmap_magneticCNN_pdr.py benchmarks/knn/wifi_mag_knn.py
          ! grep -R "HEADING_WHITE_NOISE_RAD\|STEP_LENGTH_M" train/kalmannet_wifiheatmap_magneticCNN_pdr.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-run matched benchmark and split audit
        run: |
          python benchmarks/knn/wifi_mag_knn.py --protocol both --output benchmarks/knn/current_results
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
      - name: Compile paper
        run: |
          mkdir -p /tmp/p1-p3-paper
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/p1-p3-paper main.tex
      - name: Commit validated changes
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add train/kalmannet_wifiheatmap_magneticCNN_pdr.py benchmarks/knn/wifi_mag_knn.py benchmarks/knn/current_results paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git commit -m 'paper: align PDR and synthetic evaluation methodology'
          git push origin HEAD:fix/p1-p3-methodology
      - uses: actions/upload-artifact@v4
        with:
          name: p1-p3-methodology-preview
          path: |
            /tmp/p1-p3-paper/main.pdf
            benchmarks/knn/current_results/summary.json
            benchmarks/knn/current_results/trajectory_protocol/metrics.json
