name: Temporary Jha framing validation
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/jha-framing-citations
      - name: Apply reviewer-driven paper revision
        run: python .github/tmp_apply_jha_framing.py
      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
      - name: Claim-language guards
        run: |
          ! grep -qi 'trajectory memorization' paper/main.tex
          ! grep -qi 'learned Bayesian filter' paper/main.tex
          ! grep -qi 'generalized, decoupled' paper/main.tex
          ! grep -qi 'optimally fuses' paper/main.tex
          ! grep -qi 'entirely building-agnostic' paper/main.tex
          grep -q 'li2016hybrid' paper/main.tex
          grep -q 'wang2020factorgraph' paper/main.tex
          grep -q 'eq:ekf_gain' paper/main.tex
      - name: Commit permanent edits
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add paper/main.tex paper/Ref.bib paper/reviews/prof_read_ieee_comments_draft.md
          git commit -m 'paper: revise framing and citations from Jha review'
          git push origin HEAD:paper/jha-framing-citations
      - uses: actions/upload-artifact@v4
        with:
          name: jha-framing-paper-preview
          path: paper/build/main.pdf
