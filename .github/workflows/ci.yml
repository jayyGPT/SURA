name: Repository checks

on:
  push:
    branches:
      - main
      - agent/simplify-workflows
  pull_request:

jobs:
  dataset-inventory:
    name: Verify tracked dataset snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count source files
        run: |
          python scripts/data/count_dataset.py \
            --verify-snapshot \
            --json dataset_inventory.json
      - name: Upload dataset inventory
        uses: actions/upload-artifact@v4
        with:
          name: dataset-inventory
          path: dataset_inventory.json

  code:
    name: Code and direct-script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Compile and lint
        run: |
          python -m compileall -q src scripts tests
          python -m ruff check src scripts tests
      - name: Validate included database and direct training scripts
        run: |
          python scripts/data/check_fingerprint_db.py
          python scripts/data/analyze_dataset.py --no-write
          python scripts/train/train_wifi_heatmap.py --dry-run
          python scripts/train/train_magnetic_sequence.py --dry-run
      - name: Run tests
        run: python -m pytest

  raw-data-builder:
    name: Rebuild fingerprint database from tracked raw subset
    if: github.ref == 'refs/heads/agent/simplify-workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate IT Engineering fingerprints
        run: |
          python scripts/data/build_fingerprint_db.py \
            --output /tmp/it_engineering_fingerprint \
            --no-plot
          python scripts/data/check_fingerprint_db.py \
            --database /tmp/it_engineering_fingerprint

  paper:
    name: Compile paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-pictures texlive-fonts-recommended
      - name: Compile manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
