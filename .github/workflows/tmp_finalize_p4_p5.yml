name: Temporary P4-P5 validation
on:
  push:
    branches:
      - exp/wifi-delta-ablation
permissions:
  contents: write
jobs:
  validate:
    if: "${{ startsWith(github.event.head_commit.message, 'test: run P4-P5') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/wifi-delta-ablation
      - name: Apply P4-P5 edits
        run: python .github/tmp_finalize_p4_p5.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
      - name: Compile paper
        run: |
          mkdir -p /tmp/p4-p5-paper
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/p4-p5-paper main.tex
      - name: Commit useful changes
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add benchmarks/ablate_wifi_delta.py benchmarks/wifi_delta_ablation paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git commit -m 'paper: resolve magnetic notation and Wi-Fi delta rationale'
          git push origin HEAD:exp/wifi-delta-ablation
      - uses: actions/upload-artifact@v4
        with:
          name: p4-p5-paper-preview
          path: /tmp/p4-p5-paper/main.pdf
