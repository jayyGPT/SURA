name: Temporary paper structure final validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  compact-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/measurement-method-separation
          fetch-depth: 0

      - name: Compact structural prose
        run: python tools/tmp_finalize_structure.py

      - name: Source consistency checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          assert '\\section{Sensor Measurements and Preprocessing}\\label{sec:measurements}' in text
          assert '\\section{Proposed State-Space Estimator}\\label{sec:architecture}' in text
          assert '\\section{Experimental Setup and Training}\\label{sec:setup}' in text
          method = text.split('\\section{Proposed State-Space Estimator}', 1)[1].split('\\section{Experimental Setup and Training}', 1)[0]
          assert '\\mathcal{L}_{MLP}' not in method
          assert '\\mathcal{L}_{CNN}' not in method
          assert '\\paragraph{Wi-Fi preprocessing.}' in text
          assert '\\paragraph{Magnetic preprocessing.}' in text
          assert '\\paragraph{Inertial inputs.}' in text
          print('Structural checks passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Require seven pages
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          if pages != 7:
              raise SystemExit(f'Expected 7 pages after compacting, got {pages}')
          PY

      - name: Remove temporary validation files
        run: |
          rm -f tools/tmp_restructure_paper.py tools/tmp_finalize_structure.py
          rm -f paper/notes/tmp_structure_pass.md paper/notes/tmp_structure_pass_2.md paper/notes/tmp_structure_pass_3.md
          rm -f .github/workflows/tmp-paper-structure.yml

      - name: Commit final branch state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'paper: finalize measurement-method separation'
          git push origin HEAD:paper/measurement-method-separation

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: final-structure-paper-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
