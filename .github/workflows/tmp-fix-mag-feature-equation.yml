name: Temporary magnetic feature equation validation

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/notation-math-flow
          fetch-depth: 0

      - name: Apply column-safe equation fix
        run: python tools/tmp_fix_mag_feature_equation.py

      - name: Source checks
        run: |
          git diff --check -- paper/main.tex
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          assert 'm_{H,n} &= \\sqrt{\\max(m_{N,n}^2-m_{V,n}^2,0)},\n\\nonumber\\\\\n\\delta_n' in text
          print('Magnetic equation source check passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Reject large overfull boxes
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('paper/build/main.log').read_text(errors='ignore')
          vals = [float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)', log)]
          print('Overfull hbox widths:', vals)
          if vals and max(vals) > 5.0:
              raise SystemExit(f'Large overfull hbox remains: {max(vals):.3f} pt')
          if 'LaTeX Warning: There were undefined references' in log:
              raise SystemExit('Unresolved references remain')
          PY

      - name: Remove temporary files
        run: |
          git rm -- tools/tmp_fix_mag_feature_equation.py .github/workflows/tmp-fix-mag-feature-equation.yml

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/main.tex
          git diff --cached --check
          git commit -m 'paper: fix magnetic feature equation layout'
          git push origin HEAD:paper/notation-math-flow

      - name: Upload final PDF
        uses: actions/upload-artifact@v4
        with:
          name: notation-math-final-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
