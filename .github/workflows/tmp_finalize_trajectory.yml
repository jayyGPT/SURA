name: Temporary trajectory finalization
on:
  push:
    branches:
      - finalize/trajectory-figure
permissions:
  contents: write
jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'test: run trajectory finalization' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/trajectory-figure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply source and manuscript patch
        run: |
          python .github/tmp_finalize_trajectory.py
          python -m py_compile benchmarks/knn/wifi_mag_knn.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-run current KNN and KalmanNet benchmark
        run: python benchmarks/knn/wifi_mag_knn.py --protocol both
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
      - name: Compile final paper
        run: |
          mkdir -p /tmp/final-paper
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/final-paper main.tex
      - name: Save finalization changes
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add benchmarks/knn/wifi_mag_knn.py benchmarks/knn/current_results paper/main.tex paper/reviews/professor_feedback.md
          git commit -m 'paper: restore trajectory figure and finalize review pass'
          git push origin HEAD:finalize/trajectory-figure
      - uses: actions/upload-artifact@v4
        with:
          name: final-paper-and-trajectory
          path: |
            /tmp/final-paper/main.pdf
            benchmarks/knn/current_results/trajectory_protocol/representative_trajectory.png
            benchmarks/knn/current_results/trajectory_protocol/representative_trajectory.json
