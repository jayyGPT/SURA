name: Temporary frozen-protocol correction validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.head_ref == 'audit/pre-final-claims-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/pre-final-claims-cleanup
          fetch-depth: 0

      - name: Apply protocol corrections
        run: python tools/tmp_apply_protocol_corrections.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate source and processed database
        run: |
          git diff --check
          python -m compileall -q models train benchmarks data tools tests
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.fingerprint import load_fingerprint_database

          root = Path('.')
          vocab = root / 'data/processed/fingerprint_db/it_engineering/bssid_vocab.json'
          json.loads(vocab.read_text(encoding='utf-8'))
          db = load_fingerprint_database(root / 'data/processed/fingerprint_db/it_engineering')
          assert len(db.visits) > 0
          assert len(db.ap_columns) > 0
          print(f'visits={len(db.visits)}, aps={len(db.ap_columns)}')
          PY

      - name: Run core tests
        run: pytest -q

      - name: Validate active checkpoint compatibility
        run: python train/kalmannet_wifiheatmap_magneticCNN_pdr.py --dry-run --bins 80

      - name: Run corrected development smoke evaluation
        run: |
          rm -rf audit_output/protocol_smoke
          python train/kalmannet_wifiheatmap_magneticCNN_pdr.py \
            --smoke \
            --evaluation-split development \
            --output audit_output/protocol_smoke

      - name: Run real static held-out-phone KNN check
        run: |
          rm -rf audit_output/knn_static
          python benchmarks/knn/wifi_mag_knn.py \
            --protocol static \
            --output audit_output/knn_static

      - name: Record validation metadata
        run: |
          git diff --stat > audit_output/protocol_correction_diffstat.txt
          git diff --check > audit_output/protocol_correction_diffcheck.txt
          git rev-parse HEAD > audit_output/pre_correction_commit.txt
          find audit_output -maxdepth 4 -type f -printf '%s\t%p\n' | sort -nr > audit_output/protocol_validation_files.tsv

      - name: Remove temporary audit transport files
        run: |
          rm -rf tools/tmp_payload
          git rm --ignore-unmatch \
            tools/tmp_apply_protocol_corrections.py \
            tools/tmp_pre_final_audit.py \
            .github/workflows/tmp-protocol-corrections.yml \
            .github/workflows/tmp-pre-final-audit.yml

      - name: Commit validated corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'audit: freeze corrected evaluation protocol'
          git push origin HEAD:audit/pre-final-claims-cleanup

      - name: Upload correction validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: corrected-protocol-smoke-validation
          path: audit_output
          if-no-files-found: error
          retention-days: 30
