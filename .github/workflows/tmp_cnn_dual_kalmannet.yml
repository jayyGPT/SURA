name: Temporary CNN DualKalmanNet check

on:
  push:
    branches:
      - feat/cnn-dual-kalmannet

jobs:
  test-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Bound learned gain matrices for stability experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('train/kalmannet_wifiheatmap_magneticCNN_pdr.py')
          text = path.read_text()
          old = '            gains = self.head(hidden)\n'
          new = '            gains = torch.tanh(self.head(hidden))\n'
          if old not in text:
              raise SystemExit('gain line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax check
        run: python -m py_compile train/kalmannet_wifiheatmap_magneticCNN_pdr.py models/*.py tools/*.py
      - name: Bounded-gain medium benchmark
        run: python train/kalmannet_wifiheatmap_magneticCNN_pdr.py --device cpu --train-walks 80 --test-walks 20 --fusion-epochs 60 --bins 160 --output /tmp/cnn-dual-bounded
