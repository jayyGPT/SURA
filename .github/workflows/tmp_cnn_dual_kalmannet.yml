name: Temporary CNN DualKalmanNet check

on:
  push:
    branches:
      - feat/cnn-dual-kalmannet

jobs:
  test-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile train/kalmannet_wifiheatmap_magneticCNN_pdr.py models/*.py tools/*.py
      - name: Full trained benchmark
        run: python train/kalmannet_wifiheatmap_magneticCNN_pdr.py --device cpu --train-walks 250 --test-walks 60 --fusion-epochs 150 --bins 160 --output /tmp/cnn-dual-full
