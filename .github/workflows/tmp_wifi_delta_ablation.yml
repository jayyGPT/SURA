name: Temporary Wi-Fi delta ablation
on:
  push:
    branches:
      - exp/wifi-delta-ablation
permissions:
  contents: write
jobs:
  ablate:
    if: "${{ startsWith(github.event.head_commit.message, 'test: run Wi-Fi delta ablation') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/wifi-delta-ablation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check ablation script
        run: python -m py_compile benchmarks/ablate_wifi_delta.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full paired ablation
        run: python benchmarks/ablate_wifi_delta.py --device cpu
      - name: Commit benchmark outputs
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add benchmarks/wifi_delta_ablation
          git commit -m 'benchmark: record Wi-Fi delta ablation results'
          git push origin HEAD:exp/wifi-delta-ablation
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-delta-ablation
          path: |
            benchmarks/wifi_delta_ablation/metrics.json
            benchmarks/wifi_delta_ablation/README.md
