name: Temporary paper R4 R5 revision
on:
  push:
    branches:
      - feat/cnn-dual-kalmannet
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnn-dual-kalmannet
      - name: Apply manuscript patch and compile
        run: |
          if [ "$(git log -1 --pretty=%s)" != "test: rerun paper R4 R5 revision" ]; then
            echo "No paper revision needed on this commit."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp_patch_paper_r4_r5.py')
          s = p.read_text(encoding='utf-8')
          old = "for token in ['A_"
          new = "for token in ['y_{mag} = A_"
          if old not in s:
              raise SystemExit('guard pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/tmp_patch_paper_r4_r5.py
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
          fi
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/paper-r4-r5 main.tex
          cd ..
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add paper/main.tex
          git commit -m 'paper: resolve magnetic CNN fusion inconsistency'
          git push origin HEAD:feat/cnn-dual-kalmannet
