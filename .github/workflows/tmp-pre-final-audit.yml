name: Temporary pre-final claims and repository audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/pre-final-claims-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/pre-final-claims-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyyaml pypdf

      - name: Run repository and claim audit
        run: |
          mkdir -p audit_output
          set +e
          python tools/tmp_pre_final_audit.py 2>&1 | tee audit_output/audit_console.log
          status=${PIPESTATUS[0]}
          echo "$status" > audit_output/audit_exit_code.txt
          echo "Audit script exit code: $status"
          exit 0

      - name: Record repository metadata
        run: |
          git rev-parse HEAD > audit_output/audited_commit.txt
          git status --short --branch > audit_output/git_status.txt
          git ls-files > audit_output/git_tracked_files.txt
          git log --oneline --decorate -30 > audit_output/recent_commits.txt
          find . -path './.git' -prune -o -type f -printf '%s\t%p\n' | sort -nr > audit_output/file_sizes.tsv

      - name: Compile the current IEEE manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Copy paper validation outputs
        run: |
          cp paper/build/main.pdf audit_output/current_paper.pdf
          cp paper/build/main.log audit_output/current_paper.log
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf = Path('audit_output/current_paper.pdf')
          Path('audit_output/current_paper_pages.txt').write_text(str(len(PdfReader(str(pdf)).pages)) + '\n')
          PY

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: pre-final-claims-repository-audit
          path: audit_output
          if-no-files-found: error
          retention-days: 30
