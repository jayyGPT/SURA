name: Temporary P6-P7 validation
on:
  push:
    branches:
      - fix/p6-p7-magnetic-cnn-audit
permissions:
  contents: write
jobs:
  validate:
    if: "${{ startsWith(github.event.head_commit.message, 'test: run P6-P7') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-p7-magnetic-cnn-audit
      - name: Apply P6-P7 paper patch
        run: |
          python .github/tmp_apply_p6p7.py
          python -m py_compile models/magnetic_sequence_cnn.py
          ! grep -F "log-variance confidence signal" paper/main.tex
          ! grep -F "variance-weighted model" paper/main.tex
          ! grep -F "relative magnetic-variance" paper/main.tex
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk poppler-utils >/dev/null
      - name: Compile and render paper
        run: |
          mkdir -p /tmp/p6p7-paper /tmp/p6p7-render
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/p6p7-paper main.tex
          pdftoppm -png -r 150 /tmp/p6p7-paper/main.pdf /tmp/p6p7-render/page
      - name: Commit useful changes
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add models/magnetic_sequence_cnn.py docs/architecture/magnetic_sequence_cnn.md benchmarks/magnetic_variance_calibration/README.md paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git commit -m 'paper: clarify magnetic CNN uncertainty semantics'
          git push origin HEAD:fix/p6-p7-magnetic-cnn-audit
      - uses: actions/upload-artifact@v4
        with:
          name: p6-p7-magnetic-cnn-preview
          path: |
            /tmp/p6p7-paper/main.pdf
            /tmp/p6p7-render/*.png
