name: Temporary trajectory crop
on:
  push:
    branches:
      - finalize/trajectory-figure
permissions:
  contents: write
jobs:
  crop:
    if: "${{ github.event.head_commit.message == 'test: run trajectory crop' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/trajectory-figure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install plotting dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Crop and regenerate representative trajectory
        run: |
          python .github/tmp_crop_trajectory.py
          python -m py_compile benchmarks/knn/wifi_mag_knn.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
      - name: Compile paper
        run: |
          mkdir -p /tmp/final-paper-cropped
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/final-paper-cropped main.tex
      - name: Save crop
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add benchmarks/knn/wifi_mag_knn.py benchmarks/knn/current_results/trajectory_protocol/representative_trajectory.png
          git commit -m 'paper: improve trajectory figure framing'
          git push origin HEAD:finalize/trajectory-figure
      - uses: actions/upload-artifact@v4
        with:
          name: final-paper-cropped
          path: |
            /tmp/final-paper-cropped/main.pdf
            benchmarks/knn/current_results/trajectory_protocol/representative_trajectory.png
