name: Temporary relative magnetic variance weighting

on:
  push:
    branches:
      - feat/cnn-dual-kalmannet

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch relative magnetic variance weighting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('train/kalmannet_wifiheatmap_magneticCNN_pdr.py')
          text = path.read_text(encoding='utf-8')

          old = '''    def __init__(self, hidden_size: int = FUSION_HIDDEN_SIZE) -> None:\n        super().__init__()\n        self.hidden_size = hidden_size\n        self.cell = nn.GRUCell(13, hidden_size)\n'''
          new = '''    def __init__(\n        self,\n        hidden_size: int = FUSION_HIDDEN_SIZE,\n        magnetic_reference_log_variance: float = 0.0,\n    ) -> None:\n        super().__init__()\n        self.hidden_size = hidden_size\n        self.magnetic_reference_log_variance = float(magnetic_reference_log_variance)\n        self.cell = nn.GRUCell(13, hidden_size)\n'''
          if old not in text:
              raise SystemExit('constructor pattern not found')
          text = text.replace(old, new, 1)

          old = '''            mag_confidence = magnetic_log_variance[:, step].clamp(-6.0, 8.0) * mag_available\n\n            features = torch.cat(\n'''
          new = '''            mag_confidence = magnetic_log_variance[:, step].clamp(-6.0, 8.0) * mag_available\n\n            # Relative confidence weighting. Since log_variance = log(sigma^2),\n            # exp(logvar - ref_logvar) = sigma^2 / sigma_ref^2.\n            relative_log_variance = (\n                magnetic_log_variance[:, step] - self.magnetic_reference_log_variance\n            ).clamp(-8.0, 8.0)\n            magnetic_weight = 1.0 / (1.0 + torch.exp(relative_log_variance))\n\n            features = torch.cat(\n'''
          if old not in text:
              raise SystemExit('confidence pattern not found')
          text = text.replace(old, new, 1)

          old = '''            magnetic_correction = mag_available * torch.bmm(\n                magnetic_gain, magnetic_innovation.unsqueeze(-1)\n            ).squeeze(-1)\n'''
          new = '''            magnetic_correction = magnetic_weight * mag_available * torch.bmm(\n                magnetic_gain, magnetic_innovation.unsqueeze(-1)\n            ).squeeze(-1)\n'''
          if old not in text:
              raise SystemExit('correction pattern not found')
          text = text.replace(old, new, 1)

          old = '''        print("  magnetic CNN measurement quality:", magnetic_measurement_summary(testing))\n\n        torch.manual_seed(SEED)\n'''
          new = '''        print("  magnetic CNN measurement quality:", magnetic_measurement_summary(testing))\n\n        training_mag_available = training[5][..., 0] > 0.5\n        training_logvar = training[4][..., 0][training_mag_available]\n        magnetic_reference_log_variance = float(np.median(training_logvar))\n        magnetic_reference_sigma = float(np.exp(0.5 * magnetic_reference_log_variance))\n        print(\n            f"  training-only magnetic reference: logvar={magnetic_reference_log_variance:.4f}, "\n            f"sigma={magnetic_reference_sigma:.3f} m"\n        )\n\n        torch.manual_seed(SEED)\n'''
          if old not in text:
              raise SystemExit('reference insertion pattern not found')
          text = text.replace(old, new, 1)

          old = '''        dual = CNNMagneticDualKalmanNet(hidden_size=FUSION_HIDDEN_SIZE).to(device)\n'''
          new = '''        dual = CNNMagneticDualKalmanNet(\n            hidden_size=FUSION_HIDDEN_SIZE,\n            magnetic_reference_log_variance=magnetic_reference_log_variance,\n        ).to(device)\n'''
          if old not in text:
              raise SystemExit('dual constructor pattern not found')
          text = text.replace(old, new, 1)

          old = '''            "magnetic_measurement": magnetic_measurement_summary(testing),\n            "wifi_only_kalmannet": baseline_summary,\n'''
          new = '''            "magnetic_measurement": magnetic_measurement_summary(testing),\n            "magnetic_reference_log_variance_training": magnetic_reference_log_variance,\n            "magnetic_reference_sigma_training_m": magnetic_reference_sigma,\n            "wifi_only_kalmannet": baseline_summary,\n'''
          if old not in text:
              raise SystemExit('report pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile train/kalmannet_wifiheatmap_magneticCNN_pdr.py
      - name: Medium weighted benchmark
        run: python train/kalmannet_wifiheatmap_magneticCNN_pdr.py --device cpu --train-walks 80 --test-walks 20 --fusion-epochs 60 --bins 160 --output /tmp/relative-weight-medium
      - name: Full weighted benchmark
        run: python train/kalmannet_wifiheatmap_magneticCNN_pdr.py --device cpu --train-walks 250 --test-walks 60 --fusion-epochs 150 --bins 160 --output /tmp/relative-weight-full
      - uses: actions/upload-artifact@v4
        with:
          name: relative-variance-weight-results
          path: |
            /tmp/relative-weight-medium
            /tmp/relative-weight-full
