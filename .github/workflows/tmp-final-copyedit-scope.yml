name: Temporary final copyedit and scope validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  copyedit-and-validate:
    if: github.head_ref == 'paper/final-copyedit-scope'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/final-copyedit-scope
          fetch-depth: 0

      - name: Apply copyedit and Route A scope pass
        run: |
          python tools/tmp_final_copyedit_scope.py
          sed -i 's/[[:space:]]\+$//' paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md

      - name: Source consistency checks
        run: |
          git diff --check -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          tracker = Path('paper/reviews/prof_read_ieee_comments_draft.md').read_text(encoding='utf-8')
          banned = [
              'Multi-Layer Perceptron', 'Convolutional Neural Network',
              'Gated Recurrent Unit', 'Wi-Fi Access Points', 'magnetic-field',
              'WiFi-only KalmanNet', 'WiFi+Mag KNN', '1D-CNN',
              'For an Extended Kalman Filter',
          ]
          for token in banned:
              assert token not in text, token
          required = [
              'surveyed, device-normalized domain rather than unseen-phone magnetic deployment',
              'no online alignment of an uncalibrated handset to that domain is evaluated',
              'does not evaluate causal normalization of a new handset',
              'causal alignment of an uncalibrated handset to that domain is not evaluated',
              '### [x] P11.', '### [x] G4.', '### [x] J1.', '### [x] J15.', '### [x] J18.',
              '### [ ] F1. Causal unseen-phone magnetic domain alignment (Route B)',
          ]
          for token in required:
              hay = tracker if token.startswith('###') else text
              assert token in hay, token
          for metric in ['0.494~m', '0.473~m', '1.533~m', '1.154~m', '24.7\\%', '1.612~m']:
              assert metric in text, metric
          print('Copyedit/scope source checks passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Validate compiled PDF
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          import re
          from pathlib import Path
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          if pages > 12:
              raise SystemExit(f'Unexpected manuscript growth: {pages} pages')
          log = Path('paper/build/main.log').read_text(errors='ignore')
          vals = [float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)', log)]
          print('Overfull hbox widths:', vals)
          if vals and max(vals) > 5.0:
              raise SystemExit(f'Large overfull hbox remains: {max(vals):.3f} pt')
          if 'LaTeX Warning: There were undefined references' in log:
              raise SystemExit('Unresolved references remain')
          PY

      - name: Remove temporary validation files
        run: git rm -- tools/tmp_final_copyedit_scope.py .github/workflows/tmp-final-copyedit-scope.yml

      - name: Commit validated paper changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git diff --cached --check
          git commit -m 'paper: finalize copyedit and magnetic scope'
          git push origin HEAD:paper/final-copyedit-scope

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: final-copyedit-scope-paper-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
