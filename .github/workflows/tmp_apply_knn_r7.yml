name: Temporary R7 KNN paper update
on:
  push:
    branches:
      - tmp/knn-baseline-run
permissions:
  contents: write
jobs:
  revise:
    if: "${{ github.event.head_commit.message == 'test: run compact R7 figure' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/knn-baseline-run
      - name: Compact R7 figure
        run: python .github/tmp_compact_knn_r7.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
      - name: Compile paper
        run: |
          mkdir -p /tmp/knn-r7-paper-compact
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/knn-r7-paper-compact main.tex
      - name: Save compact layout
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add paper/main.tex
          git commit -m 'paper: compact KNN comparison figure'
          git push origin HEAD:tmp/knn-baseline-run
      - uses: actions/upload-artifact@v4
        with:
          name: knn-r7-paper-compact-preview
          path: /tmp/knn-r7-paper-compact/main.pdf
