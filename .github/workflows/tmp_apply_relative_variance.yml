name: Temporary apply relative variance implementation

on:
  push:
    branches:
      - feat/cnn-dual-kalmannet

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnn-dual-kalmannet
      - name: Apply tested implementation and save results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git log -1 --pretty=%s)" != "test: apply relative variance implementation v2" ]; then
            echo "No source-application work needed on this commit."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('train/kalmannet_wifiheatmap_magneticCNN_pdr.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    def __init__(self, hidden_size: int = FUSION_HIDDEN_SIZE) -> None:\n        super().__init__()\n        self.hidden_size = hidden_size\n        self.cell = nn.GRUCell(13, hidden_size)\n''',
                  '''    def __init__(\n        self,\n        hidden_size: int = FUSION_HIDDEN_SIZE,\n        magnetic_reference_log_variance: float = 0.0,\n    ) -> None:\n        super().__init__()\n        self.hidden_size = hidden_size\n        self.magnetic_reference_log_variance = float(magnetic_reference_log_variance)\n        self.cell = nn.GRUCell(13, hidden_size)\n''',
              ),
              (
                  '''            mag_confidence = magnetic_log_variance[:, step].clamp(-6.0, 8.0) * mag_available\n\n            features = torch.cat(\n''',
                  '''            mag_confidence = magnetic_log_variance[:, step].clamp(-6.0, 8.0) * mag_available\n\n            # Relative confidence weighting. Since log_variance = log(sigma^2),\n            # exp(logvar - ref_logvar) = sigma^2 / sigma_ref^2.\n            relative_log_variance = (\n                magnetic_log_variance[:, step] - self.magnetic_reference_log_variance\n            ).clamp(-8.0, 8.0)\n            magnetic_weight = 1.0 / (1.0 + torch.exp(relative_log_variance))\n\n            features = torch.cat(\n''',
              ),
              (
                  '''            magnetic_correction = mag_available * torch.bmm(\n                magnetic_gain, magnetic_innovation.unsqueeze(-1)\n            ).squeeze(-1)\n''',
                  '''            magnetic_correction = magnetic_weight * mag_available * torch.bmm(\n                magnetic_gain, magnetic_innovation.unsqueeze(-1)\n            ).squeeze(-1)\n''',
              ),
              (
                  '''        print("  magnetic CNN measurement quality:", magnetic_measurement_summary(testing))\n\n        torch.manual_seed(SEED)\n''',
                  '''        print("  magnetic CNN measurement quality:", magnetic_measurement_summary(testing))\n\n        # Reference uncertainty comes from fusion-training magnetic predictions only.\n        training_mag_available = training[5][..., 0] > 0.5\n        training_logvar = training[4][..., 0][training_mag_available]\n        magnetic_reference_log_variance = float(np.median(training_logvar))\n        magnetic_reference_sigma = float(np.exp(0.5 * magnetic_reference_log_variance))\n        print(\n            f"  training-only magnetic reference: logvar={magnetic_reference_log_variance:.4f}, "\n            f"sigma={magnetic_reference_sigma:.3f} m"\n        )\n\n        torch.manual_seed(SEED)\n''',
              ),
              (
                  '''        dual = CNNMagneticDualKalmanNet(hidden_size=FUSION_HIDDEN_SIZE).to(device)\n''',
                  '''        dual = CNNMagneticDualKalmanNet(\n            hidden_size=FUSION_HIDDEN_SIZE,\n            magnetic_reference_log_variance=magnetic_reference_log_variance,\n        ).to(device)\n''',
              ),
              (
                  '''            "magnetic_measurement": magnetic_measurement_summary(testing),\n            "wifi_only_kalmannet": baseline_summary,\n''',
                  '''            "magnetic_measurement": magnetic_measurement_summary(testing),\n            "magnetic_reference_log_variance_training": magnetic_reference_log_variance,\n            "magnetic_reference_sigma_training_m": magnetic_reference_sigma,\n            "wifi_only_kalmannet": baseline_summary,\n''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected source pattern not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile train/kalmannet_wifiheatmap_magneticCNN_pdr.py

          gh run download 31414305369 -n relative-variance-weight-results -D /tmp/weighted-results
          python - <<'PY'
          from pathlib import Path
          import csv, json, shutil
          src = Path('/tmp/weighted-results/relative-weight-full/metrics.json')
          metrics = json.loads(src.read_text(encoding='utf-8'))
          shutil.copyfile(src, 'benchmarks/cnn_dual_kalmannet_relative_variance_metrics.json')
          with Path('benchmarks/cnn_dual_kalmannet_relative_variance_training_history.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.writer(handle)
              writer.writerow(['epoch','full_wifi_baseline_train_mse','full_wifi_weighted_cnn_dual_train_mse','degraded_wifi_baseline_train_mse','degraded_wifi_weighted_cnn_dual_train_mse'])
              for i in range(150):
                  writer.writerow([i+1, metrics['full']['baseline_training_loss'][i], metrics['full']['dual_training_loss'][i], metrics['degraded']['baseline_training_loss'][i], metrics['degraded']['dual_training_loss'][i]])
          PY

          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add train/kalmannet_wifiheatmap_magneticCNN_pdr.py benchmarks/cnn_dual_kalmannet_relative_variance_metrics.json benchmarks/cnn_dual_kalmannet_relative_variance_training_history.csv
          git commit -m 'feat: weight magnetic CNN correction by relative variance'
          git push origin HEAD:feat/cnn-dual-kalmannet
