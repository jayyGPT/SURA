name: Temporary paper layout fix
on:
  push:
    branches:
      - feat/cnn-dual-kalmannet
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnn-dual-kalmannet
      - name: Apply layout fix and compile
        run: |
          if [ "$(git log -1 --pretty=%s)" != "test: run paper layout fix" ]; then
            echo "No layout patch needed on this commit."
            exit 0
          fi
          python .github/tmp_layout_fix.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk >/dev/null
          mkdir -p /tmp/layout-fixed-paper
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/layout-fixed-paper main.tex
          cd ..
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add paper/main.tex paper/reviews/professor_feedback.md
          git commit -m 'paper: fix layout overlaps and update review status'
          git push origin HEAD:feat/cnn-dual-kalmannet
      - uses: actions/upload-artifact@v4
        with:
          name: layout-fixed-paper
          path: /tmp/layout-fixed-paper/main.pdf
