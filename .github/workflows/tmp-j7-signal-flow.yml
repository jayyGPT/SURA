name: Temporary J7 signal-flow validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  redraw-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/j7-signal-flow
          fetch-depth: 0

      - name: Apply J7 signal-flow pass
        run: python tools/tmp_j7_signal_flow.py

      - name: Source checks
        run: |
          git diff --check -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          tracker = Path('paper/reviews/prof_read_ieee_comments_draft.md').read_text(encoding='utf-8')
          assert '\\begin{figure*}[t]' in text
          assert 'Functional signal flow of DualKalmanNet at fusion step $t$' in text
          assert '\\mathbf{x}_t^-=\\mathbf{x}_{t-1}+\\mathbf{u}_t' in text
          assert '\\boldsymbol{\\phi}_t\\in\\mathbb{R}^{13}' in text
          assert '\\operatorname{GRUCell}' in text
          assert '### [x] J7. Redesign/recheck Fig. 1' in tracker
          print('J7 source checks passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Validate compiled PDF
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          import re
          from pathlib import Path
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          if pages > 12:
              raise SystemExit(f'Unexpected manuscript growth: {pages} pages')
          log = Path('paper/build/main.log').read_text(errors='ignore')
          vals = [float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)', log)]
          print('Overfull hbox widths:', vals)
          if vals and max(vals) > 5.0:
              raise SystemExit(f'Large overfull hbox remains: {max(vals):.3f} pt')
          if 'LaTeX Warning: There were undefined references' in log:
              raise SystemExit('Unresolved references remain')
          PY

      - name: Remove temporary validation files
        run: |
          git rm -- tools/tmp_j7_signal_flow.py .github/workflows/tmp-j7-signal-flow.yml

      - name: Commit validated paper changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git diff --cached --check
          git commit -m 'paper: redraw DualKalmanNet signal-flow figure'
          git push origin HEAD:paper/j7-signal-flow

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: j7-signal-flow-paper-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
