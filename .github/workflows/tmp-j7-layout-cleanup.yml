name: Temporary J7 layout cleanup validation

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/j7-signal-flow
          fetch-depth: 0

      - name: Apply cleaner figure layout
        run: python tools/tmp_j7_layout_cleanup.py

      - name: Source checks
        run: |
          git diff --check -- paper/main.tex
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          assert 'Auxiliary recurrent features' in text
          assert 'Posterior correction\\\\[-1pt]Eq.~(\\ref{eq:kn_correct})' in text
          assert 'Dashed arrows denote auxiliary or recurrent paths.' in text
          print('J7 cleanup source checks passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Validate compiled PDF
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          import re
          from pathlib import Path
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          if pages > 12:
              raise SystemExit(f'Unexpected manuscript growth: {pages} pages')
          log = Path('paper/build/main.log').read_text(errors='ignore')
          vals = [float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)', log)]
          print('Overfull hbox widths:', vals)
          if vals and max(vals) > 5.0:
              raise SystemExit(f'Large overfull hbox remains: {max(vals):.3f} pt')
          if 'LaTeX Warning: There were undefined references' in log:
              raise SystemExit('Unresolved references remain')
          PY

      - name: Remove temporary files
        run: |
          git rm -- tools/tmp_j7_layout_cleanup.py .github/workflows/tmp-j7-layout-cleanup.yml

      - name: Commit validated layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/main.tex
          git diff --cached --check
          git commit -m 'paper: clean up signal-flow figure layout'
          git push origin HEAD:paper/j7-signal-flow

      - name: Upload final PDF
        uses: actions/upload-artifact@v4
        with:
          name: j7-signal-flow-final-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
