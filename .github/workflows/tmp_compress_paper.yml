name: Temporary paper compression validation
on:
  push:
    branches:
      - paper/compress-7-pages
permissions:
  contents: write
jobs:
  validate:
    if: "${{ startsWith(github.event.head_commit.message, 'test: compress paper') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/compress-7-pages
      - name: Apply compression edits
        run: python .github/tmp_compress_paper.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures latexmk poppler-utils >/dev/null
      - name: Compile and render paper
        run: |
          rm -rf /tmp/compressed-paper /tmp/compressed-render
          mkdir -p /tmp/compressed-paper /tmp/compressed-render
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/compressed-paper main.tex
          pdfinfo /tmp/compressed-paper/main.pdf | grep '^Pages:' | tee /tmp/compressed-paper/page_count.txt
          pdftoppm -png -r 160 /tmp/compressed-paper/main.pdf /tmp/compressed-render/page
      - name: Commit permanent edits
        run: |
          git config user.name 'Jayendra Vijay Birhade'
          git config user.email 'cs1240891@iitd.ac.in'
          git add paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git commit -m 'paper: compact manuscript layout to seven pages' || true
          git push origin HEAD:paper/compress-7-pages
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-paper-preview
          path: |
            /tmp/compressed-paper/main.pdf
            /tmp/compressed-paper/page_count.txt
            /tmp/compressed-render/*.png
