name: Temporary notation and math-flow validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  notation-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: paper/notation-math-flow
          fetch-depth: 0

      - name: Apply notation and math-flow pass
        run: python tools/tmp_notation_math_pass.py

      - name: Source consistency checks
        run: |
          git diff --check -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/main.tex').read_text(encoding='utf-8')
          method = text.split('\\section{Proposed State-Space Estimator}', 1)[1].split('\\section{Experimental Setup and Training}', 1)[0]
          assert '\\mathbf{x}_{\\text{pred}}' not in text
          assert 't^-$ is the most recent time' not in text
          assert '\\boldsymbol{\\phi}_t\\in\\mathbb{R}^{13}' in method
          assert '\\operatorname{GRUCell}' in method
          assert '\\mathbf{u}_t=\\sum_{n\\in\\mathcal{B}_t}\\mathbf{v}_n' in method
          assert 'Estimator initialization:' in text
          print('Notation/source checks passed')
          PY

      - name: Compile IEEE paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Verify compiled PDF
        run: |
          test -f paper/build/main.pdf
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          pages = len(PdfReader('paper/build/main.pdf').pages)
          print(f'Compiled pages: {pages}')
          if pages > 12:
              raise SystemExit(f'Unexpected manuscript growth: {pages} pages')
          PY
          if grep -q 'LaTeX Warning: There were undefined references' paper/build/main.log; then
            echo 'Unresolved LaTeX references remain' >&2
            exit 1
          fi

      - name: Remove temporary validation files
        run: |
          git rm -- tools/tmp_notation_math_pass.py .github/workflows/tmp-notation-math.yml

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paper/main.tex paper/reviews/prof_read_ieee_comments_draft.md
          git diff --cached --check
          git commit -m 'paper: audit notation and mathematical flow'
          git push origin HEAD:paper/notation-math-flow

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: notation-math-paper-pdf
          path: paper/build/main.pdf
          if-no-files-found: error
